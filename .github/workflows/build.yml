name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true # Tetap dimatikan sementara karena server cache GitHub sedang gangguan

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          # Perintah ini akan mengunduh dan membuat file gradlew secara otomatis di server
          gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        shell: bash
        run: |
          # Berikan izin akses dan jalankan build
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-llama-app
          path: '**/app/build/outputs/apk/debug/*.apk'
