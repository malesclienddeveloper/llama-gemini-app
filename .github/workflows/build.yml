name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE=$(find . -maxdepth 4 -type f -name "build.gradle.kts" | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "Error: File build.gradle.kts tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Folder proyek ditemukan di: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "Membuat wrapper baru..."
            gradle wrapper --gradle-version 8.5
          fi

          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-llama-app
          path: "**/build/outputs/apk/debug/*.apk"
