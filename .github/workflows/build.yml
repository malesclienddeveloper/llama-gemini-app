name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Debug repo layout
      run: |
        echo "Repo root files:"
        ls -la
        echo "Find Gradle entry points:"
        find . -maxdepth 4 -type f \( -name "settings.gradle*" -o -name "build.gradle*" -o -name "gradlew" \) -print || true

    - name: Build Debug APK
      shell: bash
      run: |
        set -euo pipefail

        WRAPPER_PATH=$(find . -maxdepth 4 -type f -name gradlew | head -n 1 || true)

        if [ -n "${WRAPPER_PATH:-}" ]; then
          WRAPPER_DIR=$(dirname "$WRAPPER_PATH")
          echo "Found gradlew in: $WRAPPER_DIR"
          cd "$WRAPPER_DIR"
          chmod +x ./gradlew || true
          ./gradlew assembleDebug
        else
          echo "No gradlew wrapper found in repository."
          echo "Check whether Android project is in a subfolder such as app/ or android/."
          find . -maxdepth 4 -type f \( -name "settings.gradle*" -o -name "build.gradle*" \) -print
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gemini-llama-app
        path: '**/app/build/outputs/apk/debug/*.apk'