name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true # Tetap dimatikan karena gangguan cache GitHub

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          # 1. Cari file settings.gradle untuk menentukan root proyek
          BUILD_FILE=$(find . -maxdepth 4 -type f \( -name "settings.gradle*" -o -name "build.gradle*" \) | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "Tidak ditemukan file build.gradle atau settings.gradle!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Folder proyek ditemukan di: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 2. PERBAIKAN: Gunakan perintah init/wrapper bawaan tanpa merusak repositori lokal
          if [ ! -f "./gradlew" ]; then
            echo "Membuat wrapper baru secara lokal menggunakan task bawaan..."
            gradle wrapper --type-migration
          fi

          chmod +x ./gradlew
          
          # 3. Jalankan build dengan memaksa pembaruan dependensi & plugin
          ./gradlew assembleDebug --refresh-dependencies
