name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true # Tetap dimatikan sementara karena server cache GitHub sedang gangguan

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          # 1. Cari file build Android untuk menentukan folder proyek
          BUILD_FILE=$(find . -maxdepth 4 -type f \( -name "settings.gradle*" -o -name "build.gradle*" \) | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "Tidak ditemukan file build.gradle atau settings.gradle di folder mana pun!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Folder proyek ditemukan di: $PROJECT_DIR"
          
          # 2. Masuk ke folder proyek tersebut
          cd "$PROJECT_DIR"

          # 3. Buat wrapper baru karena tidak ada di Git
          echo "Membuat wrapper baru otomatis..."
          gradle wrapper --gradle-version 8.5

          # 4. Berikan izin akses dan jalankan kompilasi APK
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-llama-app
          path: '**/app/build/outputs/apk/debug/*.apk'
