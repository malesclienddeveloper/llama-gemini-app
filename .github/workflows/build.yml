- name: Build Debug APK
      shell: bash
      run: |
        set -euo pipefail

        # Cari folder utama proyek Android yang berisi build.gradle / settings.gradle
        BUILD_FILE=$(find . -maxdepth 4 -type f \( -name "settings.gradle*" -o -name "build.gradle*" \) | head -n 1)
        
        if [ -z "$BUILD_FILE" ]; then
          echo "❌ Tidak ditemukan file build.gradle atau settings.gradle!"
          exit 1
        fi

        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "📂 Folder proyek ditemukan di: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # Jika gradlew tidak ada, buat wrapper secara otomatis di runner
        if [ ! -f "./gradlew" ]; then
          echo "⚠️ gradlew tidak ditemukan. Membuat wrapper baru otomatis..."
          gradle wrapper
        fi

        chmod +x ./gradlew
        ./gradlew assembleDebug