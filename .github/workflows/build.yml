name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true # Tetap dinonaktifkan karena gangguan server cache GitHub

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          # 1. Cari folder tempat build.gradle.kts berada
          BUILD_FILE=$(find . -maxdepth 4 -type f -name "build.gradle.kts" | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "Error: File build.gradle.kts tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Folder proyek ditemukan di: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 2. PERBAIKAN UTAMA: Buat file settings.gradle.kts darurat jika belum ada
          # Ini untuk memberi tahu Gradle global di mana mencari plugin Android
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "Membuat file settings.gradle.kts darurat untuk memuat repositori..."
            cat << 'EOF' > settings.gradle.kts
            pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = "gemini-llama-app"
            EOF
          fi

          # 3. Buat wrapper baru menggunakan Gradle global versi stabil
          if [ ! -f "./gradlew" ]; then
            echo "Membuat wrapper baru..."
            gradle wrapper --gradle-version 8.5
          fi

          # 4. Berikan izin eksekusi dan jalankan kompilasi APK
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-llama-app
          path: '**/build/outputs/apk/debug/*.apk'
